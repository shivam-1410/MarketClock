<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#090B0E" stop-opacity="0"/>
    </radialGradient>

    <!-- Bezel Ring Gradient -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D333F"/>
      <stop offset="50%" stop-color="#161A22"/>
      <stop offset="100%" stop-color="#0D1016"/>
    </linearGradient>

    <!-- Dial Face Gradient -->
    <radialGradient id="dialFace" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1C212B"/>
      <stop offset="75%" stop-color="#0F1218"/>
      <stop offset="100%" stop-color="#090B0E"/>
    </radialGradient>

    <!-- Neon Accents -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

    <!-- Subtle Drop Shadows & Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)"/>

  <!-- Outer Bezel -->
  <circle cx="256" cy="256" r="224" fill="url(#bezelGrad)" stroke="#3E4554" stroke-width="2"/>
  <circle cx="256" cy="256" r="214" fill="#090B0E"/>
  <circle cx="256" cy="256" r="206" fill="url(#dialFace)" stroke="#1F242D" stroke-width="3"/>

  <!-- Subtle Dial Ticks (60-minute Track) -->
  <g stroke="#3A4252" stroke-width="2" opacity="0.6">
    <!-- Hour Ticks -->
    <line x1="256" y1="62" x2="256" y2="76" stroke="#6B7280" stroke-width="4"/>
    <line x1="450" y1="256" x2="436" y2="256" stroke="#6B7280" stroke-width="4"/>
    <line x1="256" y1="450" x2="256" y2="436" stroke="#6B7280" stroke-width="4"/>
    <line x1="62" y1="256" x2="76" y2="256" stroke="#6B7280" stroke-width="4"/>
    <!-- 30 deg ticks -->
    <line x1="353" y1="88" x2="346" y2="100"/>
    <line x1="424" y1="159" x2="412" y2="166"/>
    <line x1="424" y1="353" x2="412" y2="346"/>
    <line x1="353" y1="424" x2="346" y2="412"/>
    <line x1="159" y1="424" x2="166" y2="412"/>
    <line x1="88" y1="353" x2="100" y2="346"/>
    <line x1="88" y1="159" x2="100" y2="166"/>
    <line x1="159" y1="88" x2="166" y2="100"/>
  </g>

  <!-- 12, 3, 6, 9 Index Accents -->
  <circle cx="256" cy="86" r="4.5" fill="#34D399" filter="url(#glow)"/>
  <circle cx="426" cy="256" r="3.5" fill="#64748B"/>
  <circle cx="256" cy="426" r="3.5" fill="#64748B"/>
  <circle cx="86" cy="256" r="3.5" fill="#64748B"/>

  <!-- Meteora DLMM Liquidity Bins (Gaussian Curve Cluster in Lower Right) -->
  <g filter="url(#glow)">
    <!-- Bin 1 -->
    <rect x="290" y="324" width="16" height="54" rx="4" fill="url(#neonGreen)" opacity="0.85"/>
    <!-- Bin 2 -->
    <rect x="314" y="294" width="16" height="84" rx="4" fill="url(#neonGreen)"/>
    <!-- Bin 3 (Peak) -->
    <rect x="338" y="258" width="16" height="120" rx="4" fill="url(#neonCyan)"/>
    <!-- Bin 4 -->
    <rect x="362" y="284" width="16" height="94" rx="4" fill="url(#neonCyan)" opacity="0.95"/>
    <!-- Bin 5 -->
    <rect x="386" y="320" width="16" height="58" rx="4" fill="url(#neonCyan)" opacity="0.8"/>
  </g>

  <!-- Watch Hands (Precision Precision Instrument) -->
  <!-- Hour Hand -->
  <line x1="256" y1="256" x2="175" y2="195" stroke="url(#neonCyan)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="256" y1="256" x2="175" y2="195" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Minute Hand -->
  <line x1="256" y1="256" x2="355" y2="155" stroke="url(#neonGreen)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="256" y1="256" x2="355" y2="155" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Second Hand (Ultra-fine Emerald Sweep) -->
  <line x1="256" y1="290" x2="256" y2="105" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="256" cy="105" r="4" fill="#34D399" filter="url(#glow)"/>

  <!-- Center Pin Assembly -->
  <circle cx="256" cy="256" r="16" fill="#1E232D" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="256" cy="256" r="7" fill="#34D399" filter="url(#glow)"/>
</svg>
